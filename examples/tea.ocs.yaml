  tea api {commands} [flags]:
    summary: Make an authenticated API request
    description: |-
      Makes an authenticated HTTP request to the Gitea API and prints the response.
      
      The endpoint argument is the path to the API endpoint, which will be prefixed
      with /api/v1/ if it doesn't start with /api/ or http(s)://.
      
      Placeholders like {owner} and {repo} in the endpoint will be replaced with
      values from the current repository context.
      
      Use -f for string fields and -F for typed fields (numbers, booleans, null).
      With -F, prefix value with @ to read from file (@- for stdin). Values starting
      with [ or { are parsed as JSON arrays/objects. Wrap values in quotes to force
      string type (e.g., -F key="null" for literal string "null").
      
      Use -d/--data to send a raw JSON body. Use @file to read from a file, or @-
      to read from stdin. The -d flag cannot be combined with -f or -F.
      
      When a request body is provided via -f, -F, or -d, the method defaults to POST
      unless explicitly set with -X/--method.
      
      Note: if your endpoint contains ? or &, quote it to prevent shell expansion
      (e.g., '/repos/{owner}/{repo}/issues?state=open').
    flags:
    - name: method
      aliases:
      - X
      type: string
      summary: HTTP method (GET, POST, PUT, PATCH, DELETE)
    - name: field
      aliases:
      - f
      type: string
      variadic: true
      summary: Add a string field to the request body (key=value)
    - name: Field
      aliases:
      - F
      type: string
      variadic: true
      summary: "Add a typed field to the request body (key=value, @file, or @- for stdin)"
    - name: header
      aliases:
      - H
      type: string
      variadic: true
      summary: Add a custom header (key:value)
    - name: data
      aliases:
      - d
      type: string
      summary: "Raw JSON request body (use @file to read from file, @- for stdin)"
    - name: include
      aliases:
      - i
      type: boolean
      summary: Include HTTP status and response headers in output (written to stderr)
    - name: output
      aliases:
      - o
      type: string
      summary: Write response body to file instead of stdout (use '-' for stdout)
    - name: login
      aliases:
      - l
      type: string
      summary: Use a different Gitea Login. Optional
    - name: repo
      aliases:
      - r
      type: string
      summary: Override local repository path or gitea repository slug to interact with. Optional
    - name: remote
      aliases:
      - R
      type: string
      summary: Discover Gitea login from remote. Optional
    kind: action
  tea api help:
    summary: Shows a list of commands or help for one command
    aliases:
    - h
    kind: action
