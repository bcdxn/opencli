opencliVersion: 1.0.0-alpha.13
info:
  title: command line tool to interact with Gitea
  description: |
    tea is a productivity helper for Gitea. It can be used to manage most entities on
    one or multiple Gitea instances & provides local helpers like 'tea pr checkout'.
    
    tea tries to make use of context provided by the repository in $PWD if available.
    tea works best in a upstream/fork workflow, when the local main branch tracks the
    upstream repo. tea assumes that local git state is published on the remote before
    doing operations with tea.    Configuration is persisted in $XDG_CONFIG_HOME/tea.
  binary: tea
  version: "Version: \x1b[1mdevelopment\x1b[0m\tgolang: 1.26.5"
global:
  config: {}
  flags:
  - name: help
    aliases:
    - h
    type: boolean
    summary: Show help for command
  - name: version
    aliases:
    - v
    type: boolean
    summary: Show CLI version
  - name: debug
    aliases:
    - vvv
    type: boolean
    summary: Enable debug mode
commands:
  tea {commands} [flags]:
    summary: command line tool to interact with Gitea
    description: |
      tea is a productivity helper for Gitea. It can be used to manage most entities on
      one or multiple Gitea instances & provides local helpers like 'tea pr checkout'.
      
      tea tries to make use of context provided by the repository in $PWD if available.
      tea works best in a upstream/fork workflow, when the local main branch tracks the
      upstream repo. tea assumes that local git state is published on the remote before
      doing operations with tea.    Configuration is persisted in $XDG_CONFIG_HOME/tea.
    flags:
    - name: debug
      aliases:
      - vvv
      type: boolean
      summary: Enable debug mode
    kind: action
  tea logins {commands} [flags]:
    summary: Log in to a Gitea server
    description: Log in to a Gitea server
    aliases:
    - login
    kind: action
  tea logins list {commands} [flags]:
    summary: List Gitea logins
    description: List Gitea logins
    aliases:
    - ls
    flags:
    - name: output
      aliases:
      - o
      type: string
      summary: Output format. (simple, table, csv, tsv, yaml, json)
    kind: action
  tea logins list help:
    summary: Shows a list of commands or help for one command
    aliases:
    - h
    kind: action
  tea logins add {commands} [flags]:
    summary: Add a Gitea login
    description: |-
      Add a Gitea login, without args it will create one interactively.
      
      By default tea only stores the token for its own API use. Pass --git-credentials
      to also register tea as a git credential helper for the login's URL, so that
      'git push' and 'git clone' over HTTPS authenticate silently using the stored
      token. Equivalent to running 'tea login helper setup' afterwards.
    flags:
    - name: name
      aliases:
      - "n"
      type: string
      summary: Login name
    - name: url
      aliases:
      - u
      type: string
      summary: Server URL
    - name: no-version-check
      aliases:
      - nv
      type: boolean
      summary: Do not check version of Gitea instance
    - name: token
      aliases:
      - t
      type: string
      summary: Access token. Can be obtained from Settings > Applications
    - name: user
      type: string
      summary: User for basic auth (will create token)
    - name: password
      aliases:
      - pwd
      type: string
      summary: Password for basic auth (will create token)
    - name: otp
      type: string
      summary: OTP token for auth, if necessary
    - name: scopes
      type: string
      summary: Token scopes to add when creating a new token, separated by a comma
    - name: ssh-key
      aliases:
      - s
      type: string
      summary: Path to a SSH key/certificate to use, overrides auto-discovery
    - name: insecure
      aliases:
      - i
      type: boolean
      summary: Disable TLS verification
    - name: ssh-agent-principal
      aliases:
      - c
      type: string
      summary: Use SSH certificate with specified principal to login (needs a running ssh-agent with certificate loaded)
    - name: ssh-agent-key
      aliases:
      - a
      type: string
      summary: Use SSH public key or SSH fingerprint to login (needs a running ssh-agent with ssh key loaded)
    - name: git-credentials
      aliases:
      - helper
      - j
      type: boolean
      summary: Register tea as a git credential helper for this login's URL, so 'git push' and 'git clone' over HTTPS authenticate silently using the stored token
    - name: oauth
      aliases:
      - o
      type: boolean
      summary: Use interactive OAuth2 flow for authentication
    - name: client-id
      type: string
      summary: OAuth client ID (for use with --oauth)
    - name: redirect-url
      type: string
      summary: OAuth redirect URL (for use with --oauth)
    kind: action
  tea logins add help:
    summary: Shows a list of commands or help for one command
    aliases:
    - h
    kind: action
  tea logins edit {commands} [flags]:
    summary: Edit Gitea logins
    description: Edit Gitea logins
    aliases:
    - e
    flags:
    - name: output
      aliases:
      - o
      type: string
      summary: Output format. (simple, table, csv, tsv, yaml, json)
    kind: action
  tea logins edit help:
    summary: Shows a list of commands or help for one command
    aliases:
    - h
    kind: action
  tea logins delete {commands} [flags]:
    summary: Remove a Gitea login
    description: Remove a Gitea login
    aliases:
    - rm
    kind: action
  tea logins delete help:
    summary: Shows a list of commands or help for one command
    aliases:
    - h
    kind: action
  tea logins default {commands} [flags]:
    summary: Get or Set Default Login
    description: Get or Set Default Login
    flags:
    - name: output
      aliases:
      - o
      type: string
      summary: Output format. (simple, table, csv, tsv, yaml, json)
    kind: action
  tea logins default help:
    summary: Shows a list of commands or help for one command
    aliases:
    - h
    kind: action
  tea logins helper {commands} [flags]:
    summary: Act as a git credential helper for stored Gitea logins
    description: |-
      Speaks git's credential helper protocol so that HTTPS push and clone
      operations against your configured Gitea instances authenticate silently
      using the tokens tea already stores.
      
      Typical use is automatic: 'tea login add --git-credentials' (or 'tea login
      helper setup' for existing logins) registers '!tea login helper' as a
      credential helper in ~/.gitconfig. Git then invokes the 'get' subcommand
      when it needs credentials for a configured host.
    aliases:
    - git-credential
    kind: group
  tea logins helper store {commands} [flags]:
    summary: No-op (git credential protocol store/erase)
    description: No-op invoked by git on credential store/erase; tea persists credentials only in its own config
    aliases:
    - erase
    kind: action
  tea logins helper store help:
    summary: Shows a list of commands or help for one command
    aliases:
    - h
    kind: action
  tea logins helper setup {commands} [flags]:
    summary: Register tea as a git credential helper for every configured login
    description: Register tea as a git credential helper in ~/.gitconfig for every configured login
    kind: action
  tea logins helper setup help:
    summary: Shows a list of commands or help for one command
    aliases:
    - h
    kind: action
  tea logins helper get {commands} [flags]:
    summary: Return the stored token for a URL (git credential protocol)
    description: Return the stored token for a given URL in git's credential helper protocol (called by git, reads request from stdin)
    flags:
    - name: login
      aliases:
      - l
      type: string
      summary: Use a specific login
    kind: action
  tea logins helper get help:
    summary: Shows a list of commands or help for one command
    aliases:
    - h
    kind: action
  tea logins helper help:
    summary: Shows a list of commands or help for one command
    aliases:
    - h
    kind: action
  tea logins oauth-refresh {commands} [flags]:
    summary: Refresh an OAuth token
    description: Manually refresh an expired OAuth token. If the refresh token is also expired, opens a browser for re-authentication.
    kind: action
  tea logins oauth-refresh help:
    summary: Shows a list of commands or help for one command
    aliases:
    - h
    kind: action
  tea logins help:
    summary: Shows a list of commands or help for one command
    aliases:
    - h
    kind: action
  tea logout {commands} [flags]:
    summary: Log out from a Gitea server
    description: Log out from a Gitea server
    kind: action
  tea logout help:
